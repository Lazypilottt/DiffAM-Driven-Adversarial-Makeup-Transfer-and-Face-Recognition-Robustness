[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "makeup-attack"
version = "0.1.0"
description = "Similarity-guided adversarial makeup attacks on face recognition, built on DiffAM"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aditya Yadav" }]
requires-python = ">=3.8"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
face = ["insightface>=0.7.3", "onnxruntime>=1.15", "opencv-python>=4.8", "tqdm>=4.60"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
makeup-attack = "makeup_attack.cli:main"

[tool.setuptools]
packages = ["makeup_attack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py38"
extend-exclude = ["third_party", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
